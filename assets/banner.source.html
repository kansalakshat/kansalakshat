<!doctype html><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Archivo:wght@600;900&display=swap');
:root {
  --bg:#0B0D10; --ink:#DEDAD2; --muted:#8B9099; --denim:#6FA8D0; --brick:#B08556;
}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:340px;background:var(--bg);overflow:hidden}
.wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 72px}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(111,168,208,.13) 1px,transparent 1px),
    linear-gradient(90deg,rgba(111,168,208,.13) 1px,transparent 1px),
    linear-gradient(rgba(111,168,208,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(111,168,208,.055) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  -webkit-mask-image:radial-gradient(ellipse 70% 100% at 22% 50%,#000 20%,transparent 78%);
          mask-image:radial-gradient(ellipse 70% 100% at 22% 50%,#000 20%,transparent 78%)}
.glow{position:absolute;right:-120px;top:50%;transform:translateY(-50%);width:640px;height:640px;border-radius:50%;
  background:radial-gradient(circle,rgba(111,168,208,.20) 0%,rgba(111,168,208,.05) 42%,transparent 68%)}
.eyebrow{position:relative;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
  letter-spacing:.34em;text-transform:uppercase;color:var(--denim);margin-bottom:20px}
h1{position:relative;font-family:'Archivo',sans-serif;font-weight:900;font-size:92px;line-height:.92;
  letter-spacing:-.035em;color:var(--ink)}
h1 .k{color:var(--denim)}
.rule{position:relative;width:96px;height:4px;background:var(--brick);margin:26px 0 20px}
.sub{position:relative;font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--muted)}
.sub b{color:var(--ink);font-weight:400}
</style>
<div class="wrap"><div class="grid"></div><div class="glow"></div>
<div class="eyebrow">IIT Bhilai</div>
<h1>Akshat <span class="k">Kansal</span></h1>
<div class="rule"></div>
<div class="sub">I build things that <b>actually ship</b>.</div></div>
