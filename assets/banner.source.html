<!doctype html>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Archivo:wght@600;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1280px; height:340px; background:#08080A; overflow:hidden; }
  .wrap { position:relative; width:100%; height:100%; display:flex; flex-direction:column;
          justify-content:center; padding:0 72px; }

  /* Blueprint grid, the drafting surface a builder works on */
  .grid { position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,107,0,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,107,0,.10) 1px, transparent 1px),
      linear-gradient(rgba(255,107,0,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,107,0,.045) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    -webkit-mask-image: radial-gradient(ellipse 70% 100% at 22% 50%, #000 20%, transparent 78%);
            mask-image: radial-gradient(ellipse 70% 100% at 22% 50%, #000 20%, transparent 78%);
  }
  .glow { position:absolute; right:-120px; top:50%; transform:translateY(-50%);
          width:620px; height:620px; border-radius:50%;
          background:radial-gradient(circle, rgba(255,107,0,.20) 0%, rgba(255,107,0,.05) 42%, transparent 68%); }

  .eyebrow { position:relative; font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;
             letter-spacing:.34em; text-transform:uppercase; color:#FF6B00; margin-bottom:20px; }
  h1 { position:relative; font-family:'Archivo',sans-serif; font-weight:900; font-size:92px;
       line-height:.92; letter-spacing:-.035em; color:#F2EFE9; }
  h1 .k { color:#FF6B00; }
  .rule { position:relative; width:96px; height:4px; background:#FF6B00; margin:26px 0 20px; }
  .sub { position:relative; font-family:'JetBrains Mono',monospace; font-size:17px; color:#9B95A2; letter-spacing:.01em; }
  .sub b { color:#D8D3CB; font-weight:400; }
</style>
<div class="wrap">
  <div class="grid"></div><div class="glow"></div>
  <div class="eyebrow">IIT Bhilai</div>
  <h1>Akshat <span class="k">Kansal</span></h1>
  <div class="rule"></div>
  <div class="sub">I build things that <b>actually ship</b>.</div>
</div>
