<!doctype html><meta charset="utf-8">
<style>
:root {
  --bg:#0B0D10; --ink:#DEDAD2; --muted:#8B9099; --denim:#6FA8D0; --brick:#B08556;
}
*{margin:0;padding:0;box-sizing:border-box}
body{width:880px;height:550px;background:var(--bg);overflow:hidden;position:relative;
 display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Consolas,monospace}
.grid{position:absolute;inset:0;
 background-image:linear-gradient(rgba(111,168,208,.075) 1px,transparent 1px),
   linear-gradient(90deg,rgba(111,168,208,.075) 1px,transparent 1px);background-size:44px 44px}
.glow{position:absolute;width:780px;height:780px;border-radius:50%;
 background:radial-gradient(circle,rgba(111,168,208,.20) 0%,rgba(111,168,208,.05) 45%,transparent 70%)}
.cap{position:absolute;left:44px;bottom:38px;color:var(--muted);font-size:13px;letter-spacing:.2em;text-transform:uppercase;z-index:3}
.cap b{display:block;color:var(--denim);font-size:15px;letter-spacing:.24em;margin-bottom:6px}
.phone{position:relative;width:268px;height:494px;border-radius:30px;border:9px solid #171A1F;
 background:#fff;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(111,168,208,.14)}
 .phone img{width:100%;height:100%;object-fit:cover;object-position:top}
</style>
