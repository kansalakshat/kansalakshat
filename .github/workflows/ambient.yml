name: ambient

# Redraws assets/ambient.svg (tonight's moon + the day counter) once a day.
# Pure stdlib Python, no action dependencies, so it cannot break on someone
# else's release.

on:
  schedule:
    - cron: "15 19 * * *"   # ~00:45 IST, so "tonight" is right for Bhilai
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: draw tonight's sky
        run: python .github/scripts/ambient.py

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ambient.svg
          git diff --staged --quiet || git commit -m "chore: redraw ambient strip"
          git push
