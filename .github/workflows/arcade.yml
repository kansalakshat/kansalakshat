name: arcade

# Generates six arcade games from the contribution grid, then picks one as the
# featured game of the day. Pushes to the `games` branch, NOT `output` - the
# snake workflow owns `output`, and ghaction-github-pages replaces the whole
# branch, so sharing one would make each run wipe the other.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: generate arcade games
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,galaga,breakout,puzzle-bobble,bomberman,minesweeper"
          hide_month_labels: "false"

      - name: rotate the featured game
        run: |
          cd dist
          # Rotate by day-of-year so the profile shows a different game daily.
          GAMES=(pacman galaga breakout puzzle-bobble bomberman minesweeper)
          DAY=$(date +%j)
          PICK="${GAMES[$(( 10#$DAY % ${#GAMES[@]} ))]}"

          # The action emits "<game>-contribution-graph[-dark].svg". Resolve the
          # exact names and FAIL LOUDLY if they are missing, so a naming change
          # upstream can never silently ship a different game than featured.txt
          # claims (it did exactly that on the first run).
          LIGHT="${PICK}-contribution-graph.svg"
          DARK="${PICK}-contribution-graph-dark.svg"
          [ -f "$LIGHT" ] || { echo "::error::expected $LIGHT, got: $(ls *.svg)"; exit 1; }
          [ -f "$DARK" ]  || DARK="$LIGHT"

          cp "$DARK"  featured-dark.svg
          cp "$LIGHT" featured-light.svg
          echo "$PICK" > featured.txt
          echo "featured game: $PICK  (dark=$DARK light=$LIGHT)"

      - name: push to the games branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: games
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
