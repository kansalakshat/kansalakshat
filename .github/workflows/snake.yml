name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3.5.0
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23FF6B00&color_dots=%2321262d,%23573000,%238a4a00,%23c26800,%23FF6B00
            dist/snake-light.svg?palette=github-light&color_snake=%23C24A00&color_dots=%23ebedf0,%23ffd7b5,%23ffab6b,%23e8721c,%23C24A00

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
